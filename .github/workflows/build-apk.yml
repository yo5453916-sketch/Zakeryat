name: Build APK

on:
  push:
    branches: [main]
    paths: ['Zakeryat.html', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          mkdir www
          python3 - <<'EOF'
          s = open('Zakeryat.html', encoding='utf-8').read()
          inj = '<script>window.Android={exit:function(){try{Capacitor.Plugins.App.exitApp()}catch(e){}}};</script>'
          s = s.replace('<head>', '<head>' + inj, 1) if '<head>' in s else inj + s
          open('www/index.html', 'w', encoding='utf-8').write(s)
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.duroos.app",
            "appName": "دروس وعبر",
            "webDir": "www",
            "server": { "androidScheme": "https", "cleartext": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Native VLC intent support
        run: |
          D=android/app/src/main/java/com/duroos/app
          mkdir -p $D
          cat > $D/IntentHandler.java <<'EOF'
          package com.duroos.app;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "IntentHandler")
          public class IntentHandler extends Plugin {
            @Override
            public Boolean shouldOverrideLoad(Uri url) {
              if ("intent".equals(url.getScheme())) {
                try {
                  Intent i = Intent.parseUri(url.toString(), Intent.URI_INTENT_SCHEME);
                  i.addCategory(Intent.CATEGORY_BROWSABLE);
                  i.setComponent(null);
                  getContext().startActivity(i);
                } catch (Exception e) {
                  try {
                    Intent m = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=org.videolan.vlc"));
                    m.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    getContext().startActivity(m);
                  } catch (Exception ignored) {}
                }
                return true;
              }
              return null;
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.duroos.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(IntentHandler.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../duroos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: duroos-apk
          path: duroos.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: duroos.apk
